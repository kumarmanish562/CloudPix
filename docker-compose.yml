
services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudpix-postgres
    environment:
      POSTGRES_DB: cloudpix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - cloudpix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudpix"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cloudpix_postgres_data:
