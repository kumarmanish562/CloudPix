spring:
  application:
    name: CloudPix-backend

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/cloudpix}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

imagekit:
  public-key: ${IMAGEKIT_PUBLIC_KEY}
  private-key: ${IMAGEKIT_PRIVATE_KEY}
  url-endpoint: ${IMAGEKIT_URL_ENDPOINT}
