spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:h2:mem:cloudpix;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH}
    username: ${TEST_DB_USERNAME:sa}
    password: ${TEST_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
app:
  jwt:
    secret: test-only-secret-0123456789abcdef0123456789abcdef
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
imagekit:
  public-key: test-public-key
  private-key: test-private-key
  url-endpoint: https://ik.imagekit.io/test
logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate: WARN
